<!--app-encabezado-private></app-encabezado-private-->

<div class="background-gray rounded-basic p-4 pt-5 ps-2 ps-sm-5 pe-2 pe-sm-5 mb-3">
  <h1 class="internal-title rounded-basic">
    Tomar decisión
  </h1>

  <form  class="ps-1 ps-sm-5 pe-1 pe-sm-5" >
    <div class="row mb-3">
      <div class="col-lg-12">
          <!-- label class="form-label">Se cuenta con concilación de otra institución o entidad acerca de los alimentos de la persona adulta mayor</label-->
          <label class="form-label">¿Hay concilación de alimentos anterior?</label>
          <div class="pt-2">
              <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" [value]="true"
                      [(ngModel)]="concilacion" name="concilacion"
                      id="concilacion_si" />
                  <label class="form-check-label form-label" for="concilacion_si"> Si </label>
              </div>
              <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" [value]="false"
                      [(ngModel)]="concilacion" name="concilacion"
                      id="concilacion_no" />
                  <label class="form-check-label form-label" for="concilacion_no"> No </label>
              </div>

          </div>
      </div>
      <div class="col-lg-12" *ngIf="concilacion === true">
          <label class="form-label">¿Se cumplio?</label>
          <div class="pt-2">
              <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" [value]="true"
                      [(ngModel)]="cumpleConcilacion" name="cumpleConcilacion"
                      id="cumpleConcilacion_si" />
                  <label class="form-check-label form-label" for="cumpleConcilacion_si"> Si </label>
              </div>
              <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" [value]="false"
                      [(ngModel)]="cumpleConcilacion" name="cumpleConcilacion"
                      id="cumpleConcilacion_no" />
                  <label class="form-check-label form-label" for="cumpleConcilacion_no"> No </label>
              </div>

          </div>
      </div>
      <div class="col-lg-12" *ngIf="concilacion == true && cumpleConcilacion === false">
        <app-carga-archivo
          (baseArchivo)="cargarArchivo($event)"
          textoCargar="Cargar acta concilación anterior"
        ></app-carga-archivo>
      </div>
    </div>

  </form>
</div>
