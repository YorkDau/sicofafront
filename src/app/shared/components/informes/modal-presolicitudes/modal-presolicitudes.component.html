<div class="p-3 position-relative d-flex flex-column" style="height: 90vh;">
  <button mat-icon-button class="close-button position-absolute top-0 end-0" (click)="cerrarModal()">
    <mat-icon class="close-icon" color="warn">close</mat-icon>
  </button>

  <section class="background-gray rounded-basic p-2 mb-2">
    <div class="d-flex align-items-center mb-2">
      <span class="title-medium" style="font-size: 30px">
        CONSULTA GENERAL DE PRE-SOLICITUDES
      </span>
    </div>
    <p class="subtitle-medium">
      <strong>Encuentre las pre-solicitudes que previamente han impuesto un caso en Comisaría de Familia.</strong>
    </p>
  </section>

  <form
    class="background-gray rounded-basic p-3 mb-3"
    [formGroup]="form"
    autocomplete="off"
    (submit)="consultarPresolicitudes()"
  >
    <div class="row">
      <div class="col-lg-3">
        <div class="mb-2">
          <label for="fechaSolicitud" class="form-label">Fecha Solicitud Inicial</label>
          <div class="input-group">
            <input
              matInput
              readonly
              (click)="pickerInicio.open()"
              [matDatepicker]="pickerInicio"
              class="form-control form-control-date-Picker sinborde-DatePicker"
              id="fechaSolicitud"
              placeholder="Fecha Solicitud Inicial"
              formControlName="fechaSolicitud"
            />
            <span class="input-group-text sinfondo-DatePicker">
              <mat-datepicker-toggle matSuffix [for]="pickerInicio"></mat-datepicker-toggle>
              <mat-datepicker #pickerInicio></mat-datepicker>
            </span>
          </div>
        </div>
      </div>

      <div class="col-lg-3">
        <div class="mb-2">
          <label for="fechaSolicitudFinal" class="form-label">Fecha Solicitud Final</label>
          <div class="input-group">
            <input
              matInput
              readonly
              (click)="pickerFinal.open()"
              [matDatepicker]="pickerFinal"
              class="form-control form-control-date-Picker sinborde-DatePicker"
              id="fechaSolicitudFinal"
              placeholder="Fecha Solicitud Final"
              formControlName="fechaSolicitudFinal"
            />
            <span class="input-group-text sinfondo-DatePicker">
              <mat-datepicker-toggle matSuffix [for]="pickerFinal"></mat-datepicker-toggle>
              <mat-datepicker #pickerFinal></mat-datepicker>
            </span>
          </div>
        </div>
      </div>

      <div class="col-lg-3">
        <div class="mb-2">
          <label for="codigo" class="form-label">Código solicitud</label>
          <input
            type="text"
            class="form-control"
            formControlName="codigoSolicitud"
            maxlength="40"
            id="codigo"
          />
        </div>
      </div>

      <div class="col-lg-3 d-flex align-items-center justify-content-end">
        <div class="mt-2">
          <button type="submit" class="btn btn-primary">
            <img src="assets/images/busqueda.svg" alt="search" class="img-fluid me-2" />
            Buscar
          </button>
        </div>
      </div>
    </div>

    <div *ngIf="form.errors?.rangoFechasInvalido" class="text-danger mt-2">
      La fecha inicial debe ser menor o igual que la fecha final.
    </div>
  </form>

  <div class="background-light rounded-basic p-2 mb-2 flex-grow-1 d-flex flex-column" *ngIf="formSubmitted">
    <div class="w-50" *ngIf="listaCasos.length === 0">
      <app-no-data [mensaje]="mensajeSinReg"></app-no-data>
    </div>

    <div class="flex-grow-1 d-flex flex-column" [ngStyle]="{ display: listaCasos.length > 0 ? 'flex' : 'none' }">
      <div class="table-container flex-grow-1" 
           [ngStyle]="{
             'overflow': 'auto',
             'max-height': listaCasos.length > 6 ? '400px' : 'unset'
           }">
        <aurora-table
          [data]="listaCasos"
          [columns]="columns"
          [actions]="actions"
          [pageSizeOptions]="[5, 10, 20, 50]"
          class="w-100"
        >
          <ng-template #noDataTemplate>
            <div class="text-center p-4">
              <app-no-data [mensaje]="mensajeSinReg"></app-no-data>
            </div>
          </ng-template>
        </aurora-table>
      </div>
    </div>
  </div>
</div>
