<div class="position-relative d-flex flex-column" style="height: 85vh; overflow: hidden; padding: 1rem;">
  <!-- Botón cerrar fijo arriba a la derecha -->
  <button mat-icon-button 
          (click)="cerrarModal()" 
          style="position: absolute; top: 1rem; right: 1rem; z-index: 10;">
    <mat-icon class="close-icon" color="warn">close</mat-icon>
  </button>

  <!-- Encabezado -->
  <section class="background-gray rounded-basic px-2 py-1 mb-2">
    <div class="d-flex align-items-center mb-1">
      <span class="title-medium" style="font-size: 24px">
        CONSULTA GENERAL DE PRE-SOLICITUDES
      </span>
    </div>
    <p class="subtitle-medium mb-0">
      <strong>Encuentre las pre-solicitudes que previamente han impuesto un caso en Comisaría de Familia.</strong>
    </p>
  </section>

  <!-- Formulario -->
  <form
    class="background-gray rounded-basic px-3 py-2"
    [formGroup]="form"
    autocomplete="off"
    (submit)="consultarPresolicitudes()"
  >
    <div class="row">
      <!-- Fecha inicial -->
      <div class="col-lg-3">
        <div class="mb-2">
          <label for="fechaSolicitud" class="form-label">Fecha Solicitud Inicial</label>
          <div class="input-group">
            <input matInput readonly (click)="pickerInicio.open()"
              [matDatepicker]="pickerInicio"
              class="form-control form-control-date-Picker sinborde-DatePicker"
              id="fechaSolicitud"
              placeholder="Fecha Solicitud Inicial"
              formControlName="fechaSolicitud"
            />
            <span class="input-group-text sinfondo-DatePicker">
              <mat-datepicker-toggle matSuffix [for]="pickerInicio"></mat-datepicker-toggle>
              <mat-datepicker #pickerInicio></mat-datepicker>
            </span>
          </div>
        </div>
      </div>

      <!-- Fecha final -->
      <div class="col-lg-3">
        <div class="mb-2">
          <label for="fechaSolicitudFinal" class="form-label">Fecha Solicitud Final</label>
          <div class="input-group">
            <input matInput readonly (click)="pickerFinal.open()"
              [matDatepicker]="pickerFinal"
              class="form-control form-control-date-Picker sinborde-DatePicker"
              id="fechaSolicitudFinal"
              placeholder="Fecha Solicitud Final"
              formControlName="fechaSolicitudFinal"
            />
            <span class="input-group-text sinfondo-DatePicker">
              <mat-datepicker-toggle matSuffix [for]="pickerFinal"></mat-datepicker-toggle>
              <mat-datepicker #pickerFinal></mat-datepicker>
            </span>
          </div>
        </div>
      </div>

      <!-- Código -->
      <div class="col-lg-3">
        <div class="mb-2">
          <label for="codigo" class="form-label">Código solicitud</label>
          <input
            type="text"
            class="form-control"
            formControlName="codigoSolicitud"
            maxlength="40"
            id="codigo"
          />
        </div>
      </div>

      <!-- Botón buscar -->
      <div class="col-lg-3 d-flex align-items-end justify-content-end">
        <div>
          <button type="submit" class="btn btn-primary">
            <img src="assets/images/busqueda.svg" alt="search" class="img-fluid me-2" />
            Buscar
          </button>
        </div>
      </div>
    </div>

    <!-- Validación de fechas -->
    <div *ngIf="form.errors?.rangoFechasInvalido" class="text-danger mt-2">
      La fecha inicial debe ser menor o igual que la fecha final.
    </div>
  </form>

  <!-- Resultados -->
  <div class="background-light rounded-basic p-2 mt-2 flex-grow-1 d-flex flex-column overflow-auto" *ngIf="formSubmitted">
    
    <!-- Sin resultados -->
    <div class="w-50" *ngIf="listaCasos.length === 0">
      <app-no-data [mensaje]="mensajeSinReg"></app-no-data>
    </div>

    <!-- Con resultados -->
    <div *ngIf="listaCasos.length > 0" class="d-flex flex-column flex-grow-1">
      <div class="table-container flex-grow-1 d-flex flex-column">
        <aurora-table
          [data]="listaCasos"
          [columns]="columns"
          [actions]="actions"
          [pageSizeOptions]="[5, 10, 20, 50]"
          class="w-100"
        >
          <ng-template #noDataTemplate>
            <div class="text-center p-4">
              <app-no-data [mensaje]="mensajeSinReg"></app-no-data>
            </div>
          </ng-template>
        </aurora-table>
      </div>
    </div>
  </div>
</div>
