<section class="background-gray rounded-basic p-4 mb-3">
  <div class="d-flex align-items-center mb-3">
    <span class="title-medium" style="font-size: 30px">
      CONSULTA GENERAL DE SOLICITUDES
    </span>
    <button class="btn button-new ms-4" (click)="abrirModalPresolicitudesConsulta()">
      Consulta Presolicitudes
    </button>
  </div>
  <p class="subtitle-medium">
    Encuentre las solicitudes que previamente han impuesto un caso en Comisaría de Familia.
  </p>
</section>

<form
  class="background-gray rounded-basic p-3 mb-3"
  [formGroup]="form"
  autocomplete="off"
  (submit)="coonsultarSolicitudesGeneralesFiltro()"
>
  <div class="row">
    <div class="col-lg-3">
      <div class="mb-3">
        <label for="numdoc" class="form-label">Número de documento</label>
        <input
          type="text"
          class="form-control"
          formControlName="numeroDocumento"
          placeholder="Número de documento"
          id="numdoc"
          maxlength="20"
        />
      </div>
    </div>

    <div class="col-lg-3">
      <div class="mb-3">
        <label for="codigo" class="form-label">Código solicitud</label>
        <input
          type="text"
          class="form-control"
          formControlName="codigoSolicitud"
          placeholder="Código solicitud"
          maxlength="40"
          id="codigo"
        />
      </div>
    </div>

    <div class="col-lg-3 d-flex align-items-center justify-content-end">
      <div class="mt-3">
        <button type="submit" class="btn btn-primary">
          <img
            src="assets/images/busqueda.svg"
            alt="search"
            class="img-fluid me-2"
          />
          Buscar
        </button>
      </div>
    </div>
  </div>
</form>

<div class="background-light rounded-basic p-4 mb-4" *ngIf="formSubmitted">
  <!-- Mensaje cuando no hay resultados -->
  <div class="w-50" *ngIf="listaCasos.length === 0">
    <app-no-data [mensaje]="mensajeSinReg"></app-no-data>
  </div>

  <aurora-table
    *ngIf="listaCasos.length > 0"
    [data]="listaCasos"
    [columns]="columns"
    [actions]="actions"
    [pageSizeOptions]="[5, 10, 20]"
    class="mt-3"
  >
    <ng-template #noDataTemplate>
      <div class="text-center p-4">
        <img src="assets/images/no-data.svg" alt="No hay datos" width="100" class="mb-3">
        <p class="text-muted">{{mensajeSinReg}}</p>
      </div>
    </ng-template>
  </aurora-table>
</div>
