<div class="background-gray rounded-basic p-4 pt-5 ps-5 pe-5 mb-3">
  <h1 class="internal-title rounded-basic">Sección a cargo del área legal</h1>
  <form [formGroup]="form" class="ps-5 pe-5 mt-5">
    <div class="row align-items-start">
      <div class="col-12 offset mb-2">
        <strong>COMPETENCIA DEL CASO</strong>
      </div>
    </div>

    <div class="row px-0 p-3">
      <div class="row">
        <div class="col-lg-12">
          <label class="form-label"
            >¿El caso es competencia de la comisaría?</label
          >
          <div class="pt-2">
            <div class="form-check form-check-inline">
              <input
                class="form-check-input"
                type="radio"
                value="si"
                formControlName="competenciaComisaria"
                name="competenciaComisaria"
                id="competencia_si"
              />
              <label class="form-check-label form-label" for="competencia_si">
                Si
              </label>
            </div>
            <div class="form-check form-check-inline">
              <input
                class="form-check-input"
                type="radio"
                value="no"
                formControlName="competenciaComisaria"
                name="competenciaComisaria"
                id="competencia_no"
              />
              <label class="form-check-label form-label" for="competencia_no">
                No
              </label>
            </div>
          </div>
        </div>

        <div *ngIf="f.competenciaComisaria.value === 'no' && esMenorEdad">
          <div class="col-lg-12 mt-2">
            <label class="form-label"
              >De acuerdo al relato de los hechos existe:</label
            >
            <div class="pt-2">
              <div class="form-check form-check-inline">
                <input
                  class="form-check-input"
                  type="radio"
                  value="Inobservancia"
                  (change)="actualizarHechos($event.target.value)"
                  formControlName="hechosExistentes"
                  name="hechosExistentes"
                  id="hechosExistentes_si"
                />
                <label
                  class="form-check-label form-label"
                  for="hechosExistentes_si"
                >
                  Inobservancia
                </label>
              </div>
            </div>
          </div>

          <div
            class="col-lg-12 mt-2"
            *ngIf="f.hechosExistentes.value === 'Inobservancia'"
          >
            <div class="row">
              <div class="col-lg-12">
                <label class="form-label"
                  >¿A qué institución se va a trasladar el caso?</label
                >
              </div>
              <div class="col-lg-12">
                <div class="row">
                  <div class="col-md-4">
                    <select
                      formControlName="idEntidadTraslado"
                      id="idEntidadTraslado"
                      class="form-select form-control"
                    >
                      <option [ngValue]="null" disabled>
                        Seleccione una entidad
                      </option>
                      <option
                        *ngFor="let entidad of selectEntidad"
                        [value]="entidad.id_entidad_externa"
                      >
                        {{ entidad.nombre }}
                      </option>
                    </select>
                  </div>
                  <div
                    class="col-lg-8"
                    style="display: flex; justify-content: flex-start"
                  >
                    <button
                      type="button"
                      class="btn btn-block button-new"
                      (click)="descargarDocumento()"
                    >
                      Descargar Formato de Traslado
                      <!--mat-icon class="material-icons-outlined" style="font-size: 18px;">file_download</mat-icon-->
                    </button>
                    &nbsp;
                    <app-carga-archivo
                      *ngIf="
                        !this.infoInicial?.idAdjuntoConstanciaTraslado ||
                        this.infoInicial?.idAdjuntoConstanciaTraslado === '' ||
                        this.infoInicial?.idAdjuntoConstanciaTraslado === 0
                      "
                      (baseArchivo)="cargarConstancia($event)"
                      textoCargar="Subir Constancia del Traslado"
                    >
                    </app-carga-archivo>

                    <app-carga-archivo
                      *ngIf="
                        this.infoInicial?.idAdjuntoConstanciaTraslado !== '' &&
                        this.infoInicial?.idAdjuntoConstanciaTraslado !== 0
                      "
                      (baseArchivo)="cargarConstancia($event)"
                      [deleteIcon]="delete"
                      [downloadIcon]="delete"
                      [archivoCargado]="iFileConstancia"
                      textoCargar="Subir Constancia del Traslado"
                    >
                    </app-carga-archivo>
                  </div>
                  <div class="col-lg-12">
                    <div class="mt-3 mb-3">
                      <label for="justificacionTraslado" class="form-label"
                        >Justificación del traslado</label
                      >
                      <textarea
                        type="text"
                        class="form-control resize-none"
                        formControlName="justificacionTraslado"
                        placeholder="justificacionTraslado"
                        id="justificacionTraslado"
                        maxlength="3000"
                        style="
                          min-height: 150px;
                          max-height: 150px;
                          resize: none;
                        "
                        [ngClass]="{
                          'input-req':
                            (maxLength('justificacionTraslado') &&
                              mostrarValidaciones) ||
                            (isRequired('justificacionTraslado') &&
                              mostrarValidaciones)
                        }"
                      ></textarea>
                      <div
                        *ngIf="
                          maxLength('justificacionTraslado') &&
                          mostrarValidaciones
                        "
                        class="msj-req"
                      >
                        {{ msgInvalido }}
                      </div>
                      <div
                        class="msj-req"
                        *ngIf="
                          isRequired('justificacionTraslado') &&
                          mostrarValidaciones
                        "
                      >
                        {{ msgObligatorio }}
                      </div>
                      <div class="row float-end pe-3">
                        {{ f.justificacionTraslado.value?.length }}/3000
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="row mb-3" *ngIf="esMenorEdad">
        <div class="col-lg-12 mt-2">
          <label class="form-label"
            >Se identificaron documentos de los menores de edad.
            ¿Desea iniciar por el proceso de VERIFICACION DE DERECHOS?</label
          >

          <div class="pt-2">
            <div class="form-check form-check-inline">
              <input
                class="form-check-input"
                type="radio"
                value="si"
                formControlName="procesoPard"
                name="procesoPard"
                id="pard_si"
              />
              <label class="form-check-label form-label" for="pard_si">
                Si
              </label>
            </div>
            <div class="form-check form-check-inline">
              <input
                class="form-check-input"
                type="radio"
                value="no"
                formControlName="procesoPard"
                name="procesoPard"
                id="pard_no"
              />
              <label class="form-check-label form-label" for="pard_no">
                No
              </label>
            </div>
          </div>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-lg-12">
          <div class="mb-3">
            <label for="observaciones" class="form-label"
              >Observaciones (*)</label
            >
            <textarea
              type="text"
              class="form-control resize-none"
              formControlName="observaciones"
              placeholder="Observaciones"
              id="observaciones"
              maxlength="3000"
              style="min-height: 150px; max-height: 150px; resize: none"
              [ngClass]="{
                'input-req':
                  (maxLength('observaciones') && mostrarValidaciones) ||
                  (isRequired('observaciones') && mostrarValidaciones)
              }"
            ></textarea>
            <div
              *ngIf="maxLength('observaciones') && mostrarValidaciones"
              class="msj-req"
            >
              {{ msgInvalido }}
            </div>
            <div
              class="msj-req"
              *ngIf="isRequired('observaciones') && mostrarValidaciones"
            >
              {{ msgObligatorio }}
            </div>
            <div class="row float-end pe-3">
              {{ f.observaciones.value?.length }}/3000
            </div>
          </div>
        </div>
        <div
          *ngIf="
            f.competenciaComisaria.value === 'si' &&
            f.procesoPard.value === 'si'
          "
        >
          <div class="row mb-3">
            <div class="col-lg-12 mt-2">
              <label class="form-label"
                >El caso constituye ¿Amenaza o vulneración de derechos?</label
              >

              <div class="pt-2">
                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="radio"
                    value="si"
                    formControlName="trasladoPard"
                    name="trasladoPard"
                    id="trasladoPard_si"
                    (change)="actualizarValidacionComisaria()"
                  />
                  <label
                    class="form-check-label form-label"
                    for="trasladoPard_si"
                  >
                    Si
                  </label>
                </div>
                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="radio"
                    value="no"
                    formControlName="trasladoPard"
                    name="trasladoPard"
                    id="trasladoPard_no"
                  />
                  <label
                    class="form-check-label form-label"
                    for="trasladoPard_no"
                  >
                    No
                  </label>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div>
          <div *ngIf="f.trasladoPard.value === 'si'">
            <div class="col-lg-6 mt-2 mb-4" *ngIf="esMenorEdad">
              <label for="comisaria" class="form-label mb-1"
                >¿A que Comisaria se traslada ?*</label
              >
              <select
                id="comisaria"
                class="form-select py-1"
                formControlName="comisariaSeleccionada"
                (change)="onChangeComisaria()"
              >
                <option [ngValue]="null" disabled>
                  Seleccione una comisaría
                </option>
                <option
                  *ngFor="let comisaria of selectComisaria"
                  [value]="comisaria.id_comisaria"
                >
                  {{ comisaria.nombre }}
                </option>
              </select>
              <div
                class="msj-req"
                *ngIf="
                  mostrarValidaciones && isRequired('comisariaSeleccionada')
                "
              >
                {{ msgObligatorio }}
              </div>
            </div>

            <div class="col-lg-6 mt-2 mb-4" *ngIf="esAdultoMayor">
              <label for="comisaria" class="form-label mb-1"
                >¿A que Entidad se traslada ?*</label
              >
              <select
                id="comisaria"
                class="form-select py-1"
                formControlName="comisariaSeleccionada"
                (change)="onChangeComisaria()"
              >
                <option [ngValue]="null" disabled>
                  Seleccione una comisaría
                </option>
                <option
                  *ngFor="let comisaria of selectComisaria"
                  [value]="comisaria.id_comisaria"
                >
                  {{ comisaria.nombre }}
                </option>
              </select>
              <div
                class="msj-req"
                *ngIf="
                  mostrarValidaciones && isRequired('comisariaSeleccionada')
                "
              >
                {{ msgObligatorio }}
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>

    <div class="row mx-0 mt-2 py-4">
      <div class="col-12 px-0">
        <div
          *ngIf="esMenorEdad; else es_adulto_mayor"
          style="display: flex; justify-content: flex-end"
        >
          <app-auto-tramite
            class="me-2"
            *ngIf="perfil === 'ABO'"
          ></app-auto-tramite>
          <app-carga-archivo
            *ngIf="
              (!this.infoInicial?.idAnexoAutoTramite ||
                this.infoInicial?.idAnexoAutoTramite === '' ||
                this.infoInicial?.idAnexoAutoTramite === 0) &&
              perfil === 'ABO'
            "
            (baseArchivo)="cargarArchivo($event)"
            textoCargar="Cargar formato firmado"
          >
          </app-carga-archivo>

          <app-carga-archivo
            *ngIf="
              this.infoInicial?.idAnexoAutoTramite !== '' &&
              this.infoInicial?.idAnexoAutoTramite !== 0
            "
            (baseArchivo)="cargarArchivo($event)"
            [deleteIcon]="delete"
            [downloadIcon]="delete"
            [archivoCargado]="iFile"
            textoCargar="Cargar formato firmado"
          >
          </app-carga-archivo>
        </div>

        <ng-template #es_adulto_mayor>
          <app-carga-archivo
            *ngIf="
              (!this.infoInicial?.idAnexoAutoTramite ||
                this.infoInicial?.idAnexoAutoTramite === '' ||
                this.infoInicial?.idAnexoAutoTramite === 0) &&
              perfil === 'ABO'
            "
            (baseArchivo)="cargarArchivo($event)"
            textoCargar="Cargar Verificación Denuncia"
            classButton="btn-success"
          >
          </app-carga-archivo>

          <app-carga-archivo
            *ngIf="
              this.infoInicial?.idAnexoAutoTramite !== '' &&
              this.infoInicial?.idAnexoAutoTramite !== 0
            "
            (baseArchivo)="cargarArchivo($event)"
            [deleteIcon]="delete"
            [downloadIcon]="delete"
            [archivoCargado]="iFile"
            textoCargar="Cargar Verificación Denuncia"
            classButton="btn-success"
          >
          </app-carga-archivo>
        </ng-template>
      </div>
    </div>
  </form>
</div>

<div class="row mx-0 mt-5 mb-5 py-4 p-5" *ngIf="perfil === 'ABO'">
  <div class="col-12 d-flex justify-content-end px-0">
    <button class="btn btn-danger px-4 ms-3" (click)="cancelar()">
      Cancelar
    </button>
    <!--
    <button
      class="btn btn-primary px-4 ms-3"
      (click)="guardar()"
      [disabled]="!form.valid || !tieneArchivoFirmado()"
    >
      Guardar
    </button>
    --->
    <button
      class="btn btn-primary px-4 ms-3"
      (click)="modalConfirmaCerrarActuacion()"
      [disabled]="!form.valid || !tieneArchivoFirmado()"
    >
      Cerrar Actuaciones
    </button>
  </div>
</div>
