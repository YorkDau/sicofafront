<div class="background-gray rounded-basic p-4 mb-3">
  <form [formGroup]="myForm">
    <h4 class="text-blue mb-4">
      {{
        modo === "formato"
          ? "INSTRUMENTOS DE SEGUIMIENTO"
          : "INFORME DE SEGUIMIENTO"
      }}
    </h4>
    <div class="col-4 p-0 my-3">
      <h6>Involucrado*</h6>
      <select
        class="form-select"
        formControlName="involucrado"
        [ngClass]="{
          'input-req': isRequired('involucrado') && mostrarValidaciones
        }"
        (change)="getListaFormularios($event)"
      >
        <option disabled value="">Seleccione</option>
        <option
          *ngFor="let involucrado of listaInvolucrados"
          [value]="involucrado.idInvolucrado"
        >
          {{ involucrado.nombres | titlecase }} - {{ involucrado.documento }}
        </option>
      </select>
      <div
        class="msj-req"
        *ngIf="isRequired('involucrado') && mostrarValidaciones"
      >
        {{ msgObligatorio }}
      </div>
    </div>

  <div class="col-4 p-0 my-3" *ngIf="myForm.get('involucrado')?.value">
  <h6>
    Seleccione el <strong>
      {{ modo === 'formato' ? 'Formato de Seguimiento' : 'Formato de Informe' }}
    </strong> que desea aplicar:
  </h6>

  <select
    class="form-select"
    formControlName="formato"
    [ngClass]="{ 'input-req': isRequired('formato') && mostrarValidaciones }"
    (change)="obtenerDatosSeguimiento($event, this.value)"
  >
    <option disabled [ngValue]="null">Seleccione</option>
    <option *ngFor="let formato of listaFormatosFiltrados" [ngValue]="formato">
      {{ formato.nombre }}
    </option>
  </select>

  <div class="msj-req" *ngIf="isRequired('formato') && mostrarValidaciones">
    {{ msgObligatorio }}
  </div>
</div>

    <app-formatos
      [tipoFormato]="myForm.value.formato"
      [dataReporte]="dataReporte"
    ></app-formatos>
    <div class="my-4 d-flex">
      <button class="px-4 me-3 btn btn-primary" (click)="imprimir()">
        Imprimir Formato
      </button>
      <app-carga-archivo
        (baseArchivo)="enviarArchivo($event)"
      ></app-carga-archivo>
    </div>
    <div class="mt-3 d-flex justify-content-end gap-3">
      <button
        class="px-3 btn btn-primary"
        [routerLink]="['../../ejecutar-seguimiento/', this.objSol.idSolicitud]"
      >
        Volver
      </button>
      <button class="px-4 btn btn-primary" (click)="guardar()">Guardar</button>
    </div>
  </form>
</div>
