<div
  class="background-gray2 rounded-basic px-4 py-2 d-flex flex-column justify-content-between"
  style="min-height: 350px"
>
  <div class="row">
    <div class="col-6">
      <fieldset class="border border-primary p-2">
        <legend class="float-none w-auto p-2 text-primary">
          Generación de Formatos
        </legend>
        <div class="px-2 d-flex gap-4 align-items-baseline">
          <ng-container *ngIf="datosFirma">
            <button class="btn btn-primary px-3" (click)="generarReporte()">
              Generar Auto
            </button>
            <app-reporte-auto
              [tituloReporte]="datosFirma.tituloReporte"
            ></app-reporte-auto>
          </ng-container>
        </div>
      </fieldset>
    </div>
    <div class="col-6">
      <fieldset class="border border-primary p-2">
        <legend class="float-none w-auto p-2 text-primary">
          Cargar Formato
        </legend>
        <ng-container *ngIf="datosFirma">
          <app-carga-archivo
            (baseArchivo)="enviarArchivo($event)"
            *ngIf="nuevoArchivo"
          ></app-carga-archivo>

          <app-carga-archivo
            [downloadIcon]="delete"
            [deleteIcon]="delete"
            (baseArchivo)="enviarArchivo($event)"
            [archivoCargado]="llenarInterfaceArchivoExistente()"
            *ngIf="!nuevoArchivo"
          >
          </app-carga-archivo>
        </ng-container>
      </fieldset>
    </div>
  </div>
  <div class="row align-items-end" *ngIf="datosFirma?.esNecesarioRemitir">
    <div class="col-lg-6 px-1" *ngIf="!esAdultoMayor()">
      <label for="comisaria" class="form-label mb-1"
        >¿A que Comisaria se traslada ?*</label
      >
      <select
        id="comisaria"
        class="form-select py-1"
        [(ngModel)]="comisariaSeleccionada"
        (change)="onChangeComisaria()"
      >
        <option [ngValue]="null" disabled>Seleccione una comisaria</option>
        <option
          *ngFor="let comisaria of selectComisaria"
          [value]="comisaria.id_comisaria"
        >
          {{ comisaria.nombre }}
        </option>
      </select>
    </div>

    <div class="col-lg-6 px-1" *ngIf="esAdultoMayor()">
      <label for="comisaria" class="form-label mb-1"
        >¿A que Entidad se traslada ?*</label
      >
      <select
        [(ngModel)]="idEntidadTraslado"
        id="idEntidadTraslado"
        class="form-select form-control"
      >
        <option [ngValue]="null" disabled>
          Seleccione una entidad
        </option>
        <option
          *ngFor="let entidad of selectEntidad"
          [value]="entidad.id_entidad_externa"
        >
          {{ entidad.nombre }}
        </option>
      </select>
    </div>

    <!-- Botones a la derecha -->
    <div class="col-lg-6 d-flex align-items-center gap-2 mt-2">
      <button class="btn button-new" (click)="descargarDocumentoRemision()">
        Descargar formato Traslado
      </button>
      <app-carga-archivo
        matTooltip="Cargar constancia Traslado"
        [textoCargar]="'Cargar constancia Traslado'"
        (baseArchivo)="enviarArchivoRemision($event)"
      ></app-carga-archivo>
    </div>
  </div>

  <div class="row mt-4" *ngIf="datosFirma && datosFirma.mostrarPreguntaRecurso">
    <div class="col-12">
      <label class="form-label">
        ¿Alguna de las partes interpuso recurso y fue procedente?
      </label>
      <div class="pt-2 d-flex align-items-center gap-3">
        <div class="form-check form-check-inline">
          <input
            class="form-check-input"
            type="radio"
            id="no"
            name="rPregunta"
            value="No"
            [value]="false"
            [(ngModel)]="radioPregunta"
            (change)="cambioRadio($event.target.value)"
          />
          <label class="form-check-label form-label" for="no"> No </label>
        </div>
        <div class="form-check form-check-inline">
          <input
            class="form-check-input"
            type="radio"
            name="rPregunta"
            value="Si"
            id="si"
            [value]="true"
            [(ngModel)]="radioPregunta"
            (change)="cambioRadio($event.target.value)"
          />
          <label class="form-check-label form-label" for="si"> Si </label>
        </div>
        <div class="row mb-2" *ngIf="radioPregunta === true">
          <div class="col-lg-12">
            <button class="btn btn-secondary" (click)="descargarDocumento()">
              Descargar Formato Traslado
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="d-flex align-items-center justify-content-end mt-5 gap-3">
    <button type="button" class="btn btn-danger" (click)="cancelar()">
      Cancelar
    </button>
    <!-- <button type="button" class="btn btn-primary" *ngIf="false">
      Archivar diligencias
    </button>
  -->
    <!-- Botón Guardar deshabilitado 
    <button
      type="button"
      class="btn btn-secondary"
      (click)="cargarAdjuntoFirma(false)"
      disabled
    >
      Guardar
    </button>
    -->
    <button
      type="button"
      class="btn btn-primary"
      (click)="modalConfirmaCerrarActuacion()"
      [disabled]="
        (datosFirma?.esNecesarioRemitir &&
          ((!comisariaSeleccionada && !idEntidadTraslado) || !archivoRemision)) ||
        (!datosFirma?.esNecesarioRemitir && !archivo)
      "
    >
      Cerrar actuaciones
    </button>
  </div>
</div>
