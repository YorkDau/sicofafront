<form [formGroup]="involucradoForm" autocomplete="off">
  <div class="row">
    <div class="col-lg-3 mb-3">
      <label for="primerN" class="form-label">Primer nombre*</label>
      <input
        type="text"
        class="form-control"
        id="primerN"
        placeholder="Primer nombre"
        maxlength="50"
        formControlName="primerNombre"
        [ngClass]="{ 'input-req': isRequired('primerNombre') && mostrarValidaciones }"
      />
      <div *ngIf="isRequired('primerNombre') && mostrarValidaciones" class="msj-req">
        {{ msgObligatorio }}
      </div>
    </div>

    <div class="col-lg-3 mb-3">
      <label for="segundoN" class="form-label">Segundo nombre</label>
      <input
        type="text"
        class="form-control"
        id="segundoN"
        placeholder="Segundo nombre"
        maxlength="50"
        formControlName="segundoNombre"
      />
    </div>

    <div class="col-lg-3 mb-3">
      <label for="primerA" class="form-label">Primer apellido*</label>
      <input
        type="text"
        class="form-control"
        id="primerA"
        placeholder="Primer apellido"
        maxlength="50"
        formControlName="primerApellido"
        [ngClass]="{ 'input-req': isRequired('primerApellido') && mostrarValidaciones }"
      />
      <div *ngIf="isRequired('primerApellido') && mostrarValidaciones" class="msj-req">
        {{ msgObligatorio }}
      </div>
    </div>

    <div class="col-lg-3 mb-3">
      <label for="segundoA" class="form-label">Segundo apellido</label>
      <input
        type="text"
        class="form-control"
        id="segundoA"
        placeholder="Segundo apellido"
        maxlength="50"
        formControlName="segundoApellido"
      />
    </div>
  </div>

  <div class="row">
    <div class="col-lg-3 mb-3">
      <label for="tipoD" class="form-label">Tipo de documento</label>
      <select
        id="tipoD"
        class="form-select"
        formControlName="tipoDocumento"
        (change)="isColombiano($event)"
      >
        <option [value]="0" disabled>Seleccione una opción</option>
        <option *ngFor="let item of listaTipoDocumento" [value]="item.id_Dominio">
          {{ item.nombre_Dominio }}
        </option>
      </select>
    </div>

    <div class="col-lg-3 mb-3">
      <label for="numDoc" class="form-label">Número de documento</label>
      <input
        type="text"
        class="form-control"
        id="numDoc"
        placeholder="Número de documento"
        maxlength="20"
        formControlName="numeroDocumento"
      />
    </div>

    <div class="col-lg-3 mb-3">
      <label class="form-label">País de Expedición</label>
      <select
        class="form-select"
        formControlName="paisExp"
        (change)="cargaSelectDepartamento($event)"
      >
        <option disabled value="">País de Expedición</option>
        <option *ngFor="let pais of selectPaises" [value]="pais.paisID">
          {{ pais.nombrePais }}
        </option>
      </select>
    </div>

    <div class="col-lg-3 mb-3">
      <label class="form-label">Departamento de Expedición</label>
      <select
        class="form-select"
        formControlName="departamentoExp"
        (change)="cargaSelectMunicipio($event)"
      >
        <option disabled value="">Departamento de Expedición</option>
        <option *ngFor="let departamento of selectDepartamento" [value]="departamento.departamentoID">
          {{ departamento.departamentoNombre }}
        </option>
      </select>
    </div>
  </div>

  <div class="row">
    <div class="col-lg-3 mb-3">
      <label class="form-label">Municipio de Expedición</label>
      <select class="form-select" formControlName="municipioExp">
        <option disabled value="">Municipio de Expedición</option>
        <option *ngFor="let municipio of selectMunicipio" [value]="municipio.ciudmunID">
          {{ municipio.nombCiudMun }}
        </option>
      </select>
    </div>

<div class="col-lg-3 mb-3">
  <label for="vicAgr" class="form-label">Tipo involucrado</label>
  <select
    id="vicAgr"
    class="form-select"
    formControlName="esVictima"
  >
    <option [ngValue]="true">Accionante (Victima/Rep. Legal)</option>
    <option [ngValue]="false">Accionado</option>
  </select>
</div>

<!-- Mostrar solo si esVictima es true -->
<div
  class="col-lg-3 d-flex align-items-end justify-content-start mb-3"
  *ngIf="involucradoForm.get('esVictima')?.value"
>
  <div class="form-check">
    <input
      type="checkbox"
      class="form-check-input"
      id="esRepresentante"
      formControlName="esRepresentante"
    />
    <label class="form-check-label ms-2" for="esRepresentante">
      Es representante legal
    </label>
  </div>
</div>


    <div class="col-lg-3"></div>
  </div>

  <!-- Registro civil y nombre entidad en línea -->
  <div class="row align-items-center mb-3">
    <div class="col-lg-6">
      <p class="form-label mb-2">Registro civil fue expedido en:</p>
      <div class="form-check form-check-inline">
        <input
          class="form-check-input"
          type="radio"
          id="notaria"
          name="registroExpedidoEn"
          value="Notaria"
          formControlName="registroExpedidoEn"
        />
        <label class="form-check-label" for="notaria">Notaria</label>
      </div>
      <div class="form-check form-check-inline">
        <input
          class="form-check-input"
          type="radio"
          id="registraduria"
          name="registroExpedidoEn"
          value="Registraduría auxiliar"
          formControlName="registroExpedidoEn"
        />
        <label class="form-check-label" for="registraduria">Registraduría auxiliar</label>
      </div>
    </div>

    <div class="col-lg-6">
      <label for="nomE" class="form-label">Nombre entidad de expedición del registro civil</label>
      <input
        type="text"
        class="form-control"
        id="nomE"
        placeholder="Entidad"
        maxlength="100"
        formControlName="nombreEntidadExpedicion"
      />
    </div>
  </div>

  <div class="row">
    <div class="col-lg-4 mb-3">
      <label for="celular" class="form-label">Celular</label>
      <input
        class="form-control"
        id="celular"
        placeholder="Celular"
        type="number"
        maxlength="10"
        formControlName="telefono"
        oninput="if (this.value.length > this.maxLength) this.value = this.value.slice(0, this.maxLength);"
      />
    </div>

    <div class="col-lg-4 mb-3">
      <label for="email" class="form-label">Correo electrónico</label>
      <input
        type="email"
        class="form-control"
        id="email"
        placeholder="Correo electrónico"
        maxlength="50"
        formControlName="correoElectronico"
        [ngClass]="{ 'input-req': patternValid('correoElectronico') && mostrarValidaciones }"
      />
      <div *ngIf="patternValid('correoElectronico') && mostrarValidaciones" class="msj-req">
        {{ msgCorreoInv }}
      </div>
    </div>

    <div class="col-lg-4 mb-3">
      <label for="edad" class="form-label">Edad*</label>
      <input
        type="number"
        class="form-control"
        id="edad"
        placeholder="Edad"
        maxlength="3"
        formControlName="edad"
        oninput="if (this.value.length > this.maxLength) this.value = this.value.slice(0, this.maxLength);"
        [ngClass]="{
          'input-req': (isMin('edad') || isMax('edad') || isRequired('edad')) && mostrarValidaciones
        }"
      />
      <div *ngIf="(isMin('edad') || isMax('edad')) && mostrarValidaciones" class="msj-req">
        {{ mensajeEdad }}
      </div>
      <div *ngIf="isRequired('edad') && mostrarValidaciones" class="msj-req">
        {{ msgObligatorio }}
      </div>
    </div>
  </div>

  <div class="mb-5 w-100">
    <label for="relato" class="form-label">Datos Adicionales:</label>
    <textarea
      id="relato"
      class="form-control"
      rows="6"
      placeholder="Datos Adicionales"
      style="resize: none"
      formControlName="datosAdicionales"
    ></textarea>
  </div>
</form>
