<form [formGroup]="form" class="row">
  <div class="form-group col-lg-3 mb-5">
    <label class="form-label text-capitalize">nombres *</label>
    <input type="text" step="1" class="form-control" [ngClass]="{'border-danger':false}" placeholder="Nombres"
      formControlName="nombres" required>
    <small class="form-text text-danger" *ngIf="isRequiredField(form,'nombres',true)">Campo requerido</small>
  </div>

  <div class="form-group col-lg-3 mb-5">
    <label class="form-label text-capitalize">edad *</label>
    <input type="number" step="1" class="form-control" [ngClass]="{'border-danger':false}" placeholder="Edad"
      formControlName="edad" required (input)="inputNumber($event.target,0,99)" maxlength="2">
    <small class="form-text text-danger" *ngIf="isRequiredField(form,'edad',true)">Campo requerido</small>
  </div>

  <div class="form-group col-lg-3 mb-5">
    <label class="form-label text-capitalize">edad en *</label>
    <select type="text" class="form-select" [ngClass]="{'border-danger':false}" formControlName="edadEn" required>
      <option value="">Seleccione una opción</option>
      <option [value]="item.id_Dominio" *ngFor="let item of listaEdad">{{item.nombre_Dominio}}</option>
    </select>
    <small class="form-text text-danger" *ngIf="isRequiredField(form,'edadEn',true)">Campo requerido</small>
  </div>

  <div class="form-group col-lg-3 mb-5">
    <label class="form-label text-capitalize">sexo *</label>
    <select type="text" class="form-select" [ngClass]="{'border-danger':false}" formControlName="sexo" required>
      <option value="">Seleccione una opción</option>
      <option [value]="item.id_Dominio" *ngFor="let item of listaSexo">{{item.nombre_Dominio}}</option>
    </select>
    <small class="form-text text-danger" *ngIf="isRequiredField(form,'sexo',true)">Campo requerido</small>
  </div>

  <div class="form-group col-lg-3 mb-5">
    <label class="form-label text-capitalize">bajo custodia de</label>
    <select type="text" class="form-select" [ngClass]="{'border-danger':false}" placeholder="bajo custodia de"
      formControlName="custodia">
      <option value="">Seleccione una opción</option>
      <option [value]="item.id_Dominio" *ngFor="let item of listaTipoRelacion">{{item.nombre_Dominio}}</option>
    </select>

  </div>

  <div class="form-group col-lg-3 mb-5">
    <label class="form-label text-capitalize">relación parental *</label>
    <select type="text" class="form-select" [ngClass]="{'border-danger':false}" formControlName="relacionParental" required>
      <option value="">Seleccione una opción</option>
      <option [value]="item.id_Dominio" *ngFor="let item of listaRelacionParental">{{item.nombre_Dominio}}</option>
    </select>
    <small class="form-text text-danger" *ngIf="isRequiredField(form,'relacionParental',true)">Campo requerido</small>
  </div>
</form>
