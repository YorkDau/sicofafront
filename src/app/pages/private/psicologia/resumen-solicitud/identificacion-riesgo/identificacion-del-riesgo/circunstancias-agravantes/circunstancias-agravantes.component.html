<form>
  <h4 class="mb-4">CIRCUNSTANCIAS AGRAVANTES</h4>

  <div
    class="row"
    *ngFor="let tipo of listFormTipoViolencia"
    style="height: auto; margin-bottom: 20px"
  >
    <label class="form-label">{{ tipo.descripcion }}</label>
    <div class="pt-2">
      <div class="div-check-options">
        
        <!-- NO option (puntuacionPrevio === 0) -->
        <div class="form-check form-check-inline">
          <input
            class="form-check-input"
            type="radio"
            name="{{ tipo.idQuestionario }}"
            id="no{{ tipo.idQuestionario }}"
            (change)="habilitarRadioMes($event, tipo.idTipoViolencia)"
            
            [checked]="tipo.puntuacionPrevio === 0"
            [value]="false"
          />
          <!--  -->
          <label
            class="form-check-label form-label"
            for="no{{ tipo.idQuestionario }}"
          >
            NO
          </label>
        </div>

        <!-- SI option (puntuacionPrevio === 1) -->
        <div class="form-check form-check-inline">
          <input
            class="form-check-input"
            type="radio"
            name="{{ tipo.idQuestionario }}"
            id="si{{ tipo.idQuestionario }}"
            (change)="habilitarRadioMes($event, tipo.idTipoViolencia)"
            [value]="true"
            
            [checked]="tipo.puntuacionPrevio > 0"
          />
          <label
            class="form-check-label form-label"
            for="si{{ tipo.idQuestionario }}"
          >
            SI
          </label>
        </div>

        <!-- Nullable option (Muestra si existe tipo.nullable) -->
        <div *ngIf="tipo.nullable" class="form-check form-check-inline">
          <input
            class="form-check-input"
            type="radio"
            name="{{ tipo.idQuestionario }}"
            id="siy{{ tipo.idQuestionario }}"
            (change)="habilitarRadioMes($event, tipo.idTipoViolencia)"
            [value]="undefined"
            
            [checked]="tipo.puntuacionPrevio === undefined || tipo.puntuacionPrevio === null"
          />
          <label
            class="form-check-label form-label"
            for="siy{{ tipo.idQuestionario }}"
          >
            {{ tipo.nullable }}
          </label>
        </div>
      </div>

      <!-- Select para fuerzas armadas: Solo se muestra si se seleccionó SI (puntuacionPrevio === 1) -->
      <div
        *ngIf="
          isFuerzasArmadas(tipo.descripcion) &&
          tipo.puntuacionPrevio === 1
        "
        class="mt-3 w-40"
      >
        <label class="form-label">¿A cual?</label>
        <select
          class="form-select w-25"
          [(ngModel)]="tipo.fuerzaArmadaSeleccionada"
          name="fuerzaArmada{{ tipo.idQuestionario }}"
          (change)="
            onFuerzaArmadaChange(tipo.idQuestionario, $event.target.value)
          "
        >
          <option disabled value="">Seleccione un opción</option>
          <option
            *ngFor="let item of listaFuerzasArmadas"
            [value]="item.id_Dominio"
          >
            {{ item.nombre_Dominio }}
          </option>
        </select>
      </div>
      
      <!-- Select para antecedentes judiciales: Solo se muestra si se seleccionó SI (puntuacionPrevio === 1) -->
      <div
        *ngIf="
          isAntecedentesJudiciales(tipo.descripcion) &&
          tipo.puntuacionPrevio === 1
        "
        class="mt-3 w-40"
      >
        <label class="form-label">¿Qué tipo de antecedentes?</label>
        <select
          class="form-select w-25"
          placeholder="Seleccione una opción"
          [(ngModel)]="tipo.antecedentesSeleccionados"
          name="antecedentes{{ tipo.idQuestionario }}"
          (change)="
            onAntecedentesChange(
              tipo.idQuestionario,
              $event.target.selectedOptions
            )
          "
        >
          <option disabled value="">Seleccione un opción</option>
          <option
            *ngFor="let item of listaAntecedentesDisciplinarios"
            [value]="item.id_Dominio"
          >
            {{ item.nombre_Dominio }}
          </option>
        </select>
      </div>
    </div>
  </div>

  <div class="d-flex justify-content-end mt-5 me-5">
    <button class="btn btn-outline-danger me-3 px-5" (click)="cancelar()">
      Cancelar
    </button>
    <button class="btn btn-primary me-3 px-5" (click)="anterior()">
      Anterior
    </button>
    <button type="submit" (click)="siguiente()" class="btn btn-primary">
      Siguiente
    </button>
  </div>
</form>
