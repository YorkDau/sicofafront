<form>
  <h4 class="mb-4">CIRCUNSTANCIAS AGRAVANTES</h4>

  <div class="row" *ngFor="let tipo of listFormTipoViolencia" style="height: auto; margin-bottom: 20px;">
    <label class="form-label">{{ tipo.descripcion }}</label>
    <div class="pt-2">
      <div class="form-check form-check-inline">
        <input *ngIf="
                  tipo.puntuacionPrevio === 0 || tipo.puntuacionPrevio === undefined
                " class="form-check-input" type="radio" checked name="{{ tipo.idQuestionario }}"
          id="no{{ tipo.idQuestionario }}" (change)="habilitarRadioMes($event, tipo.idTipoViolencia)" [value]="false" />
        <input *ngIf="
                  tipo.puntuacionPrevio != 0 && tipo.puntuacionPrevio !== undefined
                " class="form-check-input" type="radio" name="{{ tipo.idQuestionario }}"
          id="no{{ tipo.idQuestionario }}" (change)="habilitarRadioMes($event, tipo.idTipoViolencia)" [value]="false" />
        <input *ngIf="tipo.puntuacionPrevio === 0 || tipo.puntuacionPrevio === null" 
               class="form-check-input" type="radio" checked 
               name="{{ tipo.idQuestionario }}" id="no{{ tipo.idQuestionario }}" 
               (change)="habilitarRadioMes($event, tipo.idTipoViolencia)" [value]="false" />
        <input *ngIf="tipo.puntuacionPrevio != 0 && tipo.puntuacionPrevio !== null" 
               class="form-check-input" type="radio" name="{{ tipo.idQuestionario }}" 
               id="no{{ tipo.idQuestionario }}" (change)="habilitarRadioMes($event, tipo.idTipoViolencia)" 
               [value]="false" />
        <label class="form-check-label form-label" for="no{{ tipo.idQuestionario }}">
          NO
        </label>
      </div>
      <div class="form-check form-check-inline">
        <input *ngIf="
                  tipo.puntuacionPrevio === 0 || tipo.puntuacionPrevio === undefined
                " class="form-check-input" type="radio" name="{{ tipo.idQuestionario }}"
          id="si{{ tipo.idQuestionario }}" (change)="habilitarRadioMes($event, tipo.idTipoViolencia)" [value]="true" />
        <input *ngIf="
                  tipo.puntuacionPrevio != 0 && tipo.puntuacionPrevio !== undefined
                " class="form-check-input" type="radio" checked name="{{ tipo.idQuestionario }}"
          id="si{{ tipo.idQuestionario }}" (change)="habilitarRadioMes($event, tipo.idTipoViolencia)" [value]="true" />
        <label class="form-check-label form-label" for="si{{ tipo.idQuestionario }}">
          SI
        </label>
      </div>
      
      <!-- Select para fuerzas armadas -->
      <div *ngIf="isFuerzasArmadas(tipo.descripcion) && (tipo.puntuacionPrevio != 0 && tipo.puntuacionPrevio !== null)" 
           class="mt-3 ">
        <label class="form-label">¿A cual?</label>
        <select class="form-select w-25" 
          [(ngModel)]="tipo.fuerzaArmadaSeleccionada" 
          name="fuerzaArmada{{tipo.idQuestionario}}"
          (change)="onFuerzaArmadaChange(tipo.idQuestionario, $event.target.value)">
          <option value="">Seleccione una opción</option>
          <option *ngFor="let opcion of fuerzasArmadasOptions" [value]="opcion.value">
            {{opcion.label}}
          </option>
        </select>
      </div>

      <!-- Select para antecedentes judiciales -->
      <div *ngIf="isAntecedentesJudiciales(tipo.descripcion) && (tipo.puntuacionPrevio != 0 && tipo.puntuacionPrevio !== null)" 
           class="mt-3">
        <label class="form-label">¿Cuáles?</label>
        <select class="form-select w-25" 
                [(ngModel)]="tipo.antecedenteJudicialSeleccionado"
                [(ngModel)]="tipo.antecedenteSeleccionado" 
                name="antecedente{{tipo.idQuestionario}}"
                (change)="onAntecedenteChange(tipo.idQuestionario, $event.target.value)">
          <option value="">Seleccione una opción</option>
          <option *ngFor="let opcion of antecedentesOptions" [value]="opcion.value">
            {{opcion.label}}
          </option>
        </select>
      </div>
      
      <div class="form-check form-check-inline">
        <input *ngIf="tipo.nullable && tipo.puntuacionPrevio !== undefined" class="form-check-input" type="radio" name="{{ tipo.idQuestionario }}"
          id="siy{{ tipo.idQuestionario }}" (change)="habilitarRadioMes($event, tipo.idTipoViolencia)" [value]="undefined" />
        <input *ngIf="tipo.nullable && tipo.puntuacionPrevio === undefined" class="form-check-input" type="radio" checked name="{{ tipo.idQuestionario }}"
          id="siy{{ tipo.idQuestionario }}" (change)="habilitarRadioMes($event, tipo.idTipoViolencia)" [value]="undefined" />
        <label class="form-check-label form-label" for="siy{{ tipo.idQuestionario }}">
          {{tipo.nullable}}
        </label>
      </div>
    </div>
  </div>

  <div class="d-flex justify-content-end mt-5 me-5">
    <button class="btn btn-outline-danger me-3 px-5" (click)="cancelar()">
      Cancelar
    </button>
    <button class="btn btn-primary me-3 px-5" (click)="anterior()">
      Anterior
    </button>
    <button type="submit" (click)="siguiente()" class="btn btn-primary">
      Siguiente
    </button>
  </div>
</form>
