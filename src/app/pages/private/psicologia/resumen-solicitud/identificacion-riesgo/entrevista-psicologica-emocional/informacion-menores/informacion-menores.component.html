<form [formGroup]="form" class="mt-3">
    <div class="mb-3">
        <label class="form-label">¿Hay menores de edad involucrados en el caso?</label>
        <div class="d-flex gap-3">
            <div class="form-check">
                <input id="saludSi" type="radio" class="form-check-input" [value]="true" name="hayMenores"
                    formControlName="hayMenores" />
                <label for="saludSi" class="form-check-label">Sí</label>
            </div>
            <div class="form-check">
                <input id="saludNo" type="radio" class="form-check-input" [value]="false" name="hayMenores"
                    formControlName="hayMenores" />
                <label for="saludNo" class="form-check-label">No</label>
            </div>
        </div>
    </div>
    <div *ngIf="form.get('hayMenores')?.value">
        <div class="col-lg-12 mb-3">
            <label for="descripcion" class="form-label">
                Valoración inicial psicológica y emocional.
            </label>
            <textarea type="text" class="form-control" id="descripcion" placeholder="Digite la descripción"
                formControlName="valoracionInicialPsicologica" maxlength="10000" rows="6"></textarea>
        </div>
        <div class="col-lg-12 mb-3">
            <label for="descripcion" class="form-label">
                Valoración inicial del entorno familiar, redes vinculares e identificación de elementos protectores y de
                riesgo para la garantía de los derechos.
            </label>
            <textarea type="text" class="form-control" id="descripcion" placeholder="Digite la descripción"
                formControlName="valoracionEntornoFamiliar" maxlength="10000" rows="6"></textarea>
        </div>
    </div>
    <div class="d-flex align-items-center justify-content-end mt-5" style="gap: 1rem">
        <button type="button" class="btn btn-outline-danger" (click)="cancelar()">Cancelar</button>
        <button type="button" class="btn btn-primary" (click)="guardar('Anterior')">Anterior</button>
        <button type="button" class="btn btn-primary" (click)="guardar('Siguiente')">Siguiente</button>
    </div>
</form>
